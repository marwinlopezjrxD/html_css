<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pokédex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pokedex">
    <div class="screen">
      <div class="pokemon-img" id="pokemon-img">
        😎 <!-- Placeholder; JS will swap this -->
      </div>
      <div class="info">
        <h2 id="pokemon-name">#001 Bulbasaur</h2>
        <p id="pokemon-type">Seed Pokémon</p>
      </div>
    </div>

    <div class="buttons">
      <button class="scan-btn" id="scan-btn">SCAN</button>
      <div class="dpad"></div>
      <div class="ab-buttons">
        <div class="btn btn-b"></div>
        <div class="btn btn-a"></div>
      </div>
    </div>
  </div>

  <!-- Vecteezy Free License Attribution -->
  <footer class="attribution">
    <p>Retro console illustration by <a href="https://www.vecteezy.com/free-vector/retro-portable-console" target="_blank">Vecteezy.com</a></p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
